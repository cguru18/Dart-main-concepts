# Student Management System Configuration

# Application Information
app.name=Student Management Learning System
app.version=1.0.0
app.description=Comprehensive student management and learning system

# Database Configuration (XAMPP Default)
db.url=jdbc:mysql://localhost:3306/student_management_db
db.username=root
db.password=
db.driver=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
db.pool.min.size=5
db.pool.max.size=20
db.connection.timeout=30000

# Security Settings
security.password.min.length=8
security.session.timeout=3600000
security.bcrypt.rounds=12

# UI Settings
ui.theme=default
ui.window.min.width=800
ui.window.min.height=600
ui.responsive.breakpoint=768

# Report Settings
reports.output.directory=${user.home}/Downloads/StudentReports
reports.max.file.size=50MB
reports.retention.days=30

# Logging Settings
logging.level.root=INFO
logging.level.com.studentmanagement=DEBUG
logging.file.max.size=10MB
logging.file.max.history=30

# Subject Selection Rules
subjects.total.min=7
subjects.total.max=8
subjects.compulsory.count=3
subjects.stem.max=2
subjects.humanities.max=2
subjects.technical.max=2

# Examination Settings
exam.marks.max.default=100
exam.marks.min=0
exam.grade.pass.threshold=40

# System Settings
system.maintenance.mode=false
system.registration.enabled=true
system.auto.backup.enabled=true
system.auto.backup.interval=24h